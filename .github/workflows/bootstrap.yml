name: Bootstrap (toolchain, compose, migrations, API)
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Enable the pinned pnpm (packageManager)
        run: corepack enable && pnpm --version
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Dependency licenses are on the allowlist
        run: pnpm license-check
      - name: SBOM (CycloneDX 1.6) matches the locks
        run: node scripts/sbom.mjs --check
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom/aurea.cdx.json
          if-no-files-found: error
      - name: Keycloak realm and API role map follow roles.reference.json
        run: node scripts/identity-gen.mjs --check
      - name: Merged migrations are immutable
        if: github.event_name == 'pull_request'
        run: |
          git fetch -q origin "${{ github.base_ref }}"
          changed=$(git diff --name-only --diff-filter=MDR FETCH_HEAD...HEAD -- 'packages/db/migrations/*.sql')
          if [ -n "$changed" ]; then
            echo "Edited or removed a migration already on ${{ github.base_ref }}; add a new one instead:"
            echo "$changed"
            exit 1
          fi
      - name: Create local .env (random passwords, git-ignored)
        run: AUREA_ENV=ci pnpm bootstrap && git check-ignore -q .env
      - name: Start PostgreSQL, Valkey and Keycloak
        run: docker compose up -d --wait
      - name: Apply migrations
        run: set -a && . ./.env && set +a && pnpm db:migrate
      - name: Tests (migrations, fail closed, tokens, PKCE login against Keycloak)
        run: set -a && . ./.env && set +a && TEST_DATABASE_URL="$DATABASE_URL" pnpm test
      - name: API starts against compose and reports ready
        run: |
          set -a && . ./.env && set +a
          API_PORT=3900 node apps/api/dist/main.js > api.log 2>&1 &
          for i in $(seq 30); do curl -fsS http://127.0.0.1:3900/readyz && break; sleep 1; done
          curl -fsS http://127.0.0.1:3900/readyz | grep -q '"database":"ok","valkey":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3900/v1/projects)" = 401
          curl -fsS http://127.0.0.1:3900/v1/geometry/families | grep -q '"ring.02"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3900/v1/me)" = 401
          token=$(curl -fsS -d grant_type=client_credentials -d client_id=aurea-ci --data-urlencode "client_secret=$KC_CI_CLIENT_SECRET" \
            "$OIDC_ISSUER/protocol/openid-connect/token" | node -pe 'JSON.parse(require("fs").readFileSync(0)).access_token')
          curl -fsS -H "authorization: Bearer $token" http://127.0.0.1:3900/v1/me | grep -q '"roles":\["auditor"\]'
          kill %1 || true
      - name: Valkey rejects unauthenticated clients
        run: |
          out=$(docker compose exec -T valkey valkey-cli ping 2>&1 || true)
          echo "$out" | grep -q NOAUTH
      - name: No secrets tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then echo ".env is tracked"; exit 1; fi
      - name: Stop
        if: always()
        run: docker compose down -v
