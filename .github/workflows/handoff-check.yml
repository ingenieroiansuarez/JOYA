name: Handoff reference checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s 23_SIMULATORS -p 'test_*.py' -v
      - run: python 23_SIMULATORS/simulator.py
