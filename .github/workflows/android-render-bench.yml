name: Android render bench APK (hito 000, P0-04)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/render-bench-android/**"
      - "tools/render-bench/scene/**"
      - ".github/workflows/android-render-bench.yml"
  pull_request:
    paths:
      - "apps/render-bench-android/**"
      - "tools/render-bench/scene/**"
      - ".github/workflows/android-render-bench.yml"
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bundled GLB must be the scene builder's output
        run: cmp tools/render-bench/scene/showcase.glb apps/render-bench-android/app/src/main/assets/showcase.glb
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK (debug-signed, not for distribution)
        run: gradle -p apps/render-bench-android --no-daemon assembleDebug
      - name: Checksum
        run: |
          cd apps/render-bench-android/app/build/outputs/apk/debug
          mv app-debug.apk aurea-render-bench-android-debug.apk
          sha256sum aurea-render-bench-android-debug.apk | tee aurea-render-bench-android-debug.apk.sha256
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: aurea-render-bench-android-debug
          path: apps/render-bench-android/app/build/outputs/apk/debug/aurea-render-bench-android-debug.apk*
          retention-days: 30
