name: Contracts (state machines, SQL, OpenAPI, permissions)
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "05_DATABASE/**"
      - "06_API_CONTRACTS/**"
      - "08_STATE_MACHINES/**"
      - "tools/contracts/**"
      - "13_AI_PROMPTS_AND_TOOLS/tools.json"
      - "11_3D_ASSET_LIBRARY/families.json"
      - "19_SCREEN_INVENTORY/**"
      - "21_SECURITY/**"
      - ".github/workflows/contracts.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the drift test reads the handoff commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --no-deps -r tools/contracts/requirements.lock
      - name: Drift check
        run: python tools/contracts/check_contracts.py
      - name: Permission check
        run: python tools/contracts/check_permissions.py
      - name: Checker tests
        run: python -m unittest -v test_check_contracts test_check_permissions
        working-directory: tools/contracts
      - name: Apply reference SQL and state constraint tests on PostgreSQL 16
        env:
          PGPASSWORD: ci-only-not-a-secret
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q \
            -f 05_DATABASE/core_reference.sql -f 05_DATABASE/tests/state_checks.sql
