# Demo stack (hito 600): the same services as compose.yaml, physically separate from local
# development: own project name, volumes, ports, database and Keycloak realm. Synthetic data only.
# Run it through `pnpm demo up` (scripts/demo.mjs), which checks .env.demo says AUREA_ENV=demo.
# Ports bound to 127.0.0.1: the phone reaches them over USB with `adb reverse`, never over the LAN.
name: aurea-demo
services:
  postgres:
    image: postgres:16.15@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
    env_file: [.env.demo]
    environment:
      POSTGRES_DB: aurea_demo
      POSTGRES_USER: aurea_demo
    ports: ["127.0.0.1:5434:5432"]
    volumes: ["demo-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurea_demo -d aurea_demo"]
      interval: 5s
      timeout: 3s
      retries: 20
  valkey:
    image: valkey/valkey:8.1.4@sha256:81db6d39e1bba3b3ff32bd3a1b19a6d69690f94a3954ec131277b9a26b95b3aa
    env_file: [.env.demo]
    command:
      - sh
      - -c
      - '[ -n "$$VALKEY_PASSWORD" ] || { echo "VALKEY_PASSWORD missing: run pnpm demo bootstrap" >&2; exit 1; }; exec valkey-server --requirepass "$$VALKEY_PASSWORD" --appendonly yes'
    ports: ["127.0.0.1:6381:6379"]
    volumes: ["demo-valkeydata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
  keycloak:
    # Same pinned image as compose.yaml. Realm generated by scripts/identity-gen.mjs (profile demo).
    image: keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
    env_file: [.env.demo]
    environment:
      KC_HOSTNAME: http://127.0.0.1:8180
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: aurea-demo-admin
    command: ["start-dev", "--import-realm"]
    ports: ["127.0.0.1:8180:8080"]
    volumes: ["./infra/keycloak-demo:/opt/keycloak/data/import:ro"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -1 <&3 | grep -q ' 200'
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s
volumes:
  demo-pgdata: {}
  demo-valkeydata: {}
