<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AUREA — Prototype</title><style>
:root{color-scheme:dark;--bg:#0c0c0d;--panel:#18181b;--gold:#c5a059;--cream:#f5f0e6;--muted:#b5b3b9;--line:#39332a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font:15px system-ui,sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:18px clamp(16px,4vw,64px);border-bottom:1px solid var(--line);gap:10px}h1,h2,h3{font-family:Georgia,serif;font-weight:400;margin:0 0 12px}h1{font-size:clamp(35px,6vw,68px);line-height:1.08}h2{font-size:28px}p{line-height:1.65;color:var(--muted)}.brand{letter-spacing:.28em;color:#e5cc96;font-family:Georgia,serif;font-size:25px}.eyebrow{font-size:11px;letter-spacing:.16em;color:#e5cc96;text-transform:uppercase}.notice{background:#272117;color:#e5cc96;padding:9px 16px;text-align:center;font-size:12px}main{max-width:1200px;margin:auto;padding:24px 20px 108px}.hero{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.split{display:grid;grid-template-columns:1.45fr 1fr;gap:16px}.btn,button{border:1px solid var(--gold);color:#e5cc96;background:transparent;border-radius:8px;padding:12px 16px;font:inherit;cursor:pointer;min-height:44px}button.primary{background:var(--gold);color:#14100b;font-weight:650}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #e5cc96;outline-offset:3px}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:7px;padding:9px;background:#121214;border-top:1px solid var(--line);z-index:5}nav button{border:0;font-size:12px;padding:10px 13px}nav button.active{background:#332819;color:#fff1cc}canvas{width:100%;max-width:100%;height:auto;aspect-ratio:4/3;background:radial-gradient(ellipse at 50% 40%,#35312b,#111216 73%);border-radius:12px;touch-action:none}label{display:block;margin-top:15px;color:#ddd3c2}input[type=range]{width:100%;accent-color:var(--gold)}select,textarea,input[type=text]{background:#101012;color:var(--cream);border:1px solid #555;border-radius:7px;padding:12px;width:100%;font:inherit}textarea{min-height:100px}small{color:var(--muted)}.price{font:34px Georgia,serif;color:#e5cc96}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stack{display:grid;gap:12px}hr{border:0;border-top:1px solid var(--line);margin:18px 0}.status{color:#e5cc96;font-size:13px}.tag{color:var(--muted);font-size:12px}.gem{font-size:50px;color:#e5cc96;line-height:1.2}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px 4px;border-bottom:1px solid var(--line)}@media(max-width:700px){.hero,.split{grid-template-columns:1fr}header{padding:12px 16px}.brand{font-size:20px}nav button{padding:10px 7px;font-size:11px}main{padding:18px 14px 100px}.card{padding:14px}}
</style></head><body><div class="notice">PROTOTIPO LOCAL · precios, IA y flujo de fabricación simulados · no CAD certificado ni transacciones reales</div><header><div class="brand">◇ AUREA</div><div class="row"><button id="switch" onclick="go('command')">Command Center</button><button onclick="reset()">Reiniciar demo</button></div></header><main id="main"></main><nav id="nav" aria-label="Navegación principal"></nav><script>
const initial=()=>({metal:'gold',gem:'emerald',d:18,w:4,t:1.8,g:6,angle:0.45,tilt:0.75,kind:'ring',rev:1,stage:0,quote:null,history:[]});let s=initial(),page='home';try{let q=localStorage.getItem('aurea-v1-demo');if(q)s={...s,...JSON.parse(q)}}catch(e){}
const M={gold:{name:'Oro amarillo 18K',rgb:[206,162,77],density:15.5,rate:85},silver:{name:'Plata 925',rgb:[190,198,210],density:10.36,rate:2},rose:{name:'Oro rosa',rgb:[204,141,122],density:15.1,rate:85}};const G={emerald:{name:'Esmeralda',rgb:[22,145,96],price:350},ruby:{name:'Rubí',rgb:[184,28,57],price:450},diamond:{name:'Diamante de laboratorio',rgb:[168,205,233],price:500},none:{name:'Sin piedra',rgb:[0,0,0],price:0}};
const money=x=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(x);const mass=()=> (s.kind==='ring'?Math.PI*((s.d/2+s.t)**2-(s.d/2)**2)*s.w:Math.PI*(s.d/2)**2*s.t)*M[s.metal].density/1000;const est=()=> (mass()*M[s.metal].rate*1.08+G[s.gem].price+250)/.65;
function persist(){try{localStorage.setItem('aurea-v1-demo',JSON.stringify(s))}catch(e){}}function reset(){if(confirm('¿Reiniciar únicamente los datos locales de esta demo?')){s=initial();persist();go('home')}}function go(p){page=p;render();window.scrollTo(0,0)}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const btn=(label,code,primary=false)=>`<button ${primary?'class="primary"':''} onclick="${code}">${label}</button>`;
const viewport=()=>`<canvas id="view" width="800" height="600" tabindex="0" aria-label="Vista geométrica 3D ilustrativa. Usa flechas para rotar o arrastra."></canvas><small>Vista de malla proyectada · arrastra o usa flechas para rotar. No es geometría de fabricación.</small>`;
function render(){document.getElementById('nav').innerHTML=[['home','Inicio'],['boutique','Boutique'],['create','Crear'],['aura','AURA'],['vault','Mi AUREA']].map(([p,n])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${n}</button>`).join('');let h='';
if(page==='home')h=`<div class="hero"><div><div class="eyebrow">Bespoke jewelry studio</div><h1>Lo que imaginas,<br>existe.</h1><p>Diseña una pieza que cuente tu historia. Elige materiales, gemas y proporciones.</p>${btn('Crear mi joya',"go('create')",true)} ${btn('Explorar boutique',"go('boutique')")}</div><div>${viewport()}</div></div><hr><div class="grid"><div class="card"><div class="gem">◇</div><h2>Atelier</h2><p>Personalización paramétrica ilustrativa.</p>${btn('Abrir editor',"go('atelier')")}</div><div class="card"><div class="gem">✧</div><h2>Genesis AI</h2><p>Conceptos de referencia simulados.</p>${btn('Describir mi idea',"go('aura')")}</div><div class="card"><div class="gem">◈</div><h2>Master Studio</h2><p>Consulta técnica y revisión profesional.</p>${btn('Ver panel',"go('command')")}</div></div>`;
if(page==='boutique')h=`<div class="eyebrow">Collection 01</div><h1>Boutique</h1><div class="grid"><div class="card"><div class="gem">◈</div><h2>Eternal Emerald</h2><p>Anillo personalizable de demostración.</p>${btn('Personalizar anillo',"choose('ring')",true)}</div><div class="card"><div class="gem">◇</div><h2>Signature Medallion</h2><p>Dije circular de demostración.</p>${btn('Personalizar dije',"choose('pendant')",true)}</div></div>`;
if(page==='create')h=`<h1>Crea tu historia.</h1><div class="grid"><div class="card"><h2>Atelier 3D</h2><p>Controles y materiales.</p>${btn('Crear anillo',"choose('ring')",true)} ${btn('Crear dije',"choose('pendant')")}</div><div class="card"><h2>Genesis AI</h2><p>Brief y propuestas de ejemplo.</p>${btn('Empezar',"go('aura')",true)}</div><div class="card"><h2>Master Studio</h2><p>La edición avanzada se implementará tras PoC.</p>${btn('Panel profesional',"go('command')")}</div></div>`;
if(page==='atelier')h=`<div class="eyebrow">Atelier / revisión ${s.rev}</div><h2>${s.kind==='ring'?'Anillo':'Medalla'}</h2><div class="split"><div class="card">${viewport()}<div class="row">${btn('Rotar izquierda',"rotate(-.2)")} ${btn('Rotar derecha',"rotate(.2)")}</div></div><div class="card"><label>Metal<select onchange="change('metal',this.value)">${Object.entries(M).map(([k,v])=>`<option value="${k}" ${s.metal===k?'selected':''}>${v.name}</option>`).join('')}</select></label><label>Piedra<select onchange="change('gem',this.value)">${Object.entries(G).map(([k,v])=>`<option value="${k}" ${s.gem===k?'selected':''}>${v.name}</option>`).join('')}</select></label>${range('d','Diámetro',14,24,.5)}${range('w','Ancho',1.5,12,.5)}${range('t','Espesor',.8,4,.1)}${range('g','Gema',3,12,.5)}<hr><small>Estimación ilustrativa, no incluye montura completa, impuestos ni envío</small><div class="price" id="price">${money(est())}</div><p id="mass">${mass().toFixed(2)} g · metal teórico</p><div class="row">${btn('Guardar revisión',"save()")}${btn('Solicitar cotización',"requestQuote()",true)}</div><p id="msg" role="status"></p></div></div>`;
if(page==='aura')h=`<div class="eyebrow">Genesis AI · simulador</div><h1>Imagina sin límites.</h1><div class="card"><div class="gem">✧</div><h2>AURA</h2><p>Describe tu pieza. Las propuestas de esta demo son presets, no inferencia generativa.</p><label>Tu idea<textarea id="brief" placeholder="Un anillo de esmeralda inspirado en la eternidad..."></textarea></label>${btn('Mostrar conceptos simulados',"concepts()",true)}<div id="concepts" class="grid" style="margin-top:16px"></div></div>`;
if(page==='vault')h=`<div class="eyebrow">Private collection</div><h1>Mi AUREA</h1><div class="grid"><div class="card"><h2>Mi diseño</h2><p>Revisión ${s.rev} · ${esc(M[s.metal].name)}</p>${btn('Continuar diseño',"go('atelier')",true)}<p>Revisiones guardadas: ${s.history.length}</p></div><div class="card"><h2>Cotización y pedido</h2><p>${stageText()}</p>${s.quote?`<div class="price">${money(s.quote.total)}</div><small>Revisión ${s.quote.rev} congelada</small>`:''}<div class="row" style="margin-top:15px">${s.stage===2?btn('Aceptar propuesta',"advance(3)",true):''}${s.stage===3?btn('Simular anticipo',"advance(4)",true):''}${s.stage===0?btn('Diseñar',"go('atelier')"):''}${s.stage>=1?btn('Ver seguimiento',"go('order')"):''}</div></div></div>`;
if(page==='command')h=`<div class="eyebrow">Professional workspace / demo</div><h1>Command Center</h1><div class="grid"><div class="card"><small>Solicitudes</small><div class="price">${s.stage>=1?1:0}</div></div><div class="card"><small>Oferta emitida</small><div class="price">${s.stage>=2?money(s.quote.total):'—'}</div></div><div class="card"><small>Taller</small><div class="price">${s.stage>=5?'1':'0'}</div></div></div><hr><div class="split"><div class="card">${viewport()}</div><div class="card"><h2>Expediente demo</h2><p>${stageText()}</p>${s.quote?`<table><tr><th>Revisión congelada</th><td>${s.quote.rev}</td></tr><tr><th>Material</th><td>${esc(M[s.quote.metal].name)}</td></tr><tr><th>Importe</th><td>${money(s.quote.total)}</td></tr></table>`:''}<div class="stack" style="margin-top:16px">${s.stage===1?btn('Revisar y emitir oferta simulada',"advance(2)",true):''}${s.stage===4?btn('Aprobar DFM / liberar (simulado)',"advance(5)",true):''}${s.stage===5?btn('Registrar QA de demostración',"advance(6)",true):''}${s.stage===6?btn('Emitir certificado simulado',"advance(7)",true):''}${btn('Volver a cliente',"go('vault')")}</div><p><small>El prototipo no ejecuta DFM, pagos ni certificación reales.</small></p></div></div>`;
if(page==='order')h=`<h1>Tu joya, paso a paso.</h1><div class="card"><h2>Pedido de demostración</h2>${['Sin solicitud','Solicitud recibida','Oferta emitida','Oferta aceptada','Anticipo simulado','Fabricación simulada','QA simulado','Certificado simulado'].map((v,i)=>`<p class="${i===s.stage?'status':''}">${i<s.stage?'✓':i===s.stage?'●':'○'} ${v}</p>`).join('')}${btn('Regresar a Mi AUREA',"go('vault')")}</div>`;
 document.getElementById('main').innerHTML=h;if(document.getElementById('view')){draw();bindCanvas()}}
function range(k,n,min,max,step){return `<label>${n}: <span id="v-${k}">${s[k]}</span> mm<input type="range" min="${min}" max="${max}" step="${step}" value="${s[k]}" oninput="change('${k}',Number(this.value))"></label>`}function choose(kind){s.kind=kind;persist();go('atelier')}function change(k,v){s[k]=v;persist();let z=document.getElementById('v-'+k);if(z)z.textContent=v;let p=document.getElementById('price');if(p)p.textContent=money(est());let a=document.getElementById('mass');if(a)a.textContent=mass().toFixed(2)+' g · metal teórico';draw()}
function save(){s.rev++;s.history.push({rev:s.rev,metal:s.metal,gem:s.gem,d:s.d,w:s.w,t:s.t,g:s.g});persist();render();document.getElementById('msg').textContent='Revisión guardada localmente.'}function requestQuote(){if(s.stage>=3){alert('Existe una oferta aceptada. Reinicia la demo para iniciar otro pedido.');return}s.rev++;s.quote={rev:s.rev,metal:s.metal,gem:s.gem,total:Math.round(est()*100)/100,d:s.d,w:s.w,t:s.t,g:s.g,kind:s.kind};s.stage=1;persist();go('vault')}
function stageText(){return ['Sin solicitud','Solicitud recibida · pendiente revisión','Oferta emitida · pendiente aceptación','Aceptada · pendiente anticipo','Anticipo simulado · pendiente aprobación','En fabricación simulada','Control de calidad simulado completado','Certificado de demostración emitido'][s.stage]||'Sin solicitud'}function advance(n){if(n!==s.stage+1)return;s.stage=n;persist();render()}function concepts(){let b=document.getElementById('brief').value.trim();if(!b){alert('Escribe una idea primero.');return}document.getElementById('concepts').innerHTML=['Classic Emerald','Royal Ruby','Minimal Silver'].map((v,i)=>`<div class="card"><h3>${v}</h3><small>Preset simulado</small><p>${['Oro amarillo y esmeralda','Oro rosa y rubí','Plata sin gema'][i]}</p>${btn('Usar propuesta',`applyConcept(${i})`,true)}</div>`).join('')}function applyConcept(i){s.kind='ring';s.metal=['gold','rose','silver'][i];s.gem=['emerald','ruby','none'][i];persist();go('atelier')}function rotate(a){s.angle+=a;draw()}
// Projected real polygon coordinates; simple painter shading, not PBR or technical CAD.
function draw(){const c=document.getElementById('view');if(!c)return;const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);const q=page==='command'&&s.quote?{...s,...s.quote}:s;const mat=M[q.metal].rgb,gem=G[q.gem].rgb;const N=72,ri=q.kind==='ring'?q.d/2:0.02,ro=q.kind==='ring'?ri+q.t:q.d/2,w=q.kind==='ring'?q.w:q.t;const faces=[];const P=(r,a,z)=>[r*Math.cos(a),r*Math.sin(a),z];const R=(v)=>{let [x,y,z]=v;let a=s.angle,b=s.tilt;let X=x*Math.cos(a)-y*Math.sin(a),Y=x*Math.sin(a)+y*Math.cos(a);return [X,Y*Math.cos(b)-z*Math.sin(b),Y*Math.sin(b)+z*Math.cos(b)]};function face(vertices,col){let v=vertices.map(R);let depth=v.reduce((a,p)=>a+p[2],0)/v.length;let u=v[1].map((x,i)=>x-v[0][i]),t=v[2].map((x,i)=>x-v[0][i]);let normal=[u[1]*t[2]-u[2]*t[1],u[2]*t[0]-u[0]*t[2],u[0]*t[1]-u[1]*t[0]];let l=Math.hypot(...normal)||1;let shade=.4+.6*Math.abs((normal[0]*-.3+normal[1]*.5+normal[2]*.8)/l);faces.push({v,depth,col:col.map(x=>Math.min(255,Math.round(x*shade+26*shade)))})}for(let i=0;i<N;i++){let a=i*2*Math.PI/N,b=(i+1)*2*Math.PI/N;face([P(ro,a,w/2),P(ro,b,w/2),P(ri,b,w/2),P(ri,a,w/2)],mat);face([P(ro,a,-w/2),P(ri,a,-w/2),P(ri,b,-w/2),P(ro,b,-w/2)],mat);face([P(ro,a,-w/2),P(ro,b,-w/2),P(ro,b,w/2),P(ro,a,w/2)],mat);face([P(ri,a,-w/2),P(ri,a,w/2),P(ri,b,w/2),P(ri,b,-w/2)],mat)}if(q.gem!=='none'){let n=10,g=q.g/2,cy=q.kind==='ring'?ro+g*.50:0,cz=w/2+g*.4;function V(r,a,z){return[r*Math.cos(a),cy+r*Math.sin(a),z]}for(let i=0;i<n;i++){let a=i*2*Math.PI/n,b=(i+1)*2*Math.PI/n;face([V(g,a,cz),V(g,b,cz),V(g*.58,b,cz+g*.52),V(g*.58,a,cz+g*.52)],gem);face([V(g*.58,a,cz+g*.52),V(g*.58,b,cz+g*.52),[0,cy,cz+g*.52]],gem);face([V(g,a,cz),[0,cy,cz-g*.8],V(g,b,cz)],gem)}}let scale=15;faces.sort((a,b)=>a.depth-b.depth);for(let f of faces){ctx.beginPath();f.v.forEach((v,i)=>{let x=c.width/2+v[0]*scale,y=c.height/2-v[1]*scale;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fillStyle=`rgb(${f.col.join(',')})`;ctx.fill();ctx.strokeStyle=ctx.fillStyle;ctx.stroke()}ctx.fillStyle='#c5a059';ctx.font='14px system-ui';ctx.fillText('AUREA / PREVIEW',22,28)}function bindCanvas(){let c=document.getElementById('view'),last=null;c.onpointerdown=e=>{last=[e.clientX,e.clientY];c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!last)return;s.angle+=(e.clientX-last[0])*.012;s.tilt=Math.max(.1,Math.min(1.5,s.tilt+(e.clientY-last[1])*.012));last=[e.clientX,e.clientY];draw()};c.onpointerup=()=>{last=null};c.onpointercancel=()=>{last=null};c.onkeydown=e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();if(e.key==='ArrowLeft')s.angle-=.15;if(e.key==='ArrowRight')s.angle+=.15;if(e.key==='ArrowUp')s.tilt=Math.max(.1,s.tilt-.1);if(e.key==='ArrowDown')s.tilt=Math.min(1.5,s.tilt+.1);draw()}}}render();
</script></body></html>
