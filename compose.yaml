# Local development only. Images pinned by digest; ports bound to 127.0.0.1.
# `pnpm bootstrap` writes .env (git-ignored) with random local passwords; all services
# read them from that file (env_file is required: compose fails without it).
name: aurea-local
services:
  postgres:
    image: postgres:16.15@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
    env_file: [.env]
    environment:
      POSTGRES_DB: aurea_local
      POSTGRES_USER: aurea_local
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurea_local -d aurea_local"]
      interval: 5s
      timeout: 3s
      retries: 20
  valkey:
    # Valkey (BSD-3-Clause), Redis-protocol compatible, used by BullMQ (ADR-0005/0007).
    image: valkey/valkey:8.1.4@sha256:81db6d39e1bba3b3ff32bd3a1b19a6d69690f94a3954ec131277b9a26b95b3aa
    env_file: [.env]
    command:
      - sh
      - -c
      - '[ -n "$$VALKEY_PASSWORD" ] || { echo "VALKEY_PASSWORD missing: run pnpm bootstrap" >&2; exit 1; }; exec valkey-server --requirepass "$$VALKEY_PASSWORD" --appendonly yes'
    ports: ["127.0.0.1:${VALKEY_PORT:-6379}:6379"]
    volumes: ["valkeydata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
  keycloak:
    # Keycloak (Apache-2.0) as the local OIDC provider. Dev mode, LOCAL/CI ONLY: the production
    # IdP is an open decision (STATUS). The realm is generated by scripts/keycloak-realm.mjs; its
    # ${KC_*} placeholders are filled from .env at import time.
    image: keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
    env_file: [.env]
    environment:
      KC_HOSTNAME: http://127.0.0.1:${KC_PORT:-8080}
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: aurea-admin
    command: ["start-dev", "--import-realm"]
    ports: ["127.0.0.1:${KC_PORT:-8080}:8080"]
    volumes: ["./infra/keycloak:/opt/keycloak/data/import:ro"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -1 <&3 | grep -q ' 200'
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s
volumes:
  pgdata: {}
  valkeydata: {}
