services:
  postgres:
    image: ${POSTGRES_IMAGE:?set reviewed postgres image tag or digest}
    environment:
      POSTGRES_DB: aurea_local
      POSTGRES_USER: aurea_local
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set local password}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurea_local -d aurea_local"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: ${REDIS_IMAGE:?set reviewed redis image tag or digest}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set local password}"]
    ports: ["127.0.0.1:6379:6379"]
volumes:
  pgdata: {}
