      - catalog
      x-permission: catalog.read
      x-first-milestone: '200'
      description: Solo productos publicados, en orden editorial. Textos en el idioma de `Accept-Language` (es o en; es por defecto), indicado en `Content-Language`. El cursor es opaco; uno inválido responde 400.
      parameters:
      - in: query
        name: cursor
        required: false
        schema: &id005
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      - in: query
        name: category
        required: false
        schema:
          $ref: '#/components/schemas/ProductCategory'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Error
          content:
            application/json:
