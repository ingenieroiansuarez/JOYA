                  translation:
                    type: array
                    items:
                      type: number
                    minItems: 3
                    maxItems: 3
                  rotationQuaternion:
                    type: array
                    items:
                      type: number
                    minItems: 4
                    maxItems: 4
                required:
                - translation
                - rotationQuaternion
                additionalProperties: false
              dependsOn:
                type: array
                items:
                  type: string
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
