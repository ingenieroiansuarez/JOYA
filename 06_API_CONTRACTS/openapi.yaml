              - providerPaymentId
              - amount
              additionalProperties: false
components:
  parameters:
    AcceptLanguage:
      in: header
      name: Accept-Language
      required: false
      description: es o en; cualquier otro valor o ausencia → es. La respuesta indica el idioma en Content-Language.
      schema:
        type: string
        maxLength: 200
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    DesignState:
      description: Generado de 08_STATE_MACHINES/machines.json (Design). No editar a mano.
      type: string
      enum:
      - DRAFT
      - REVIEW
      - APPROVED
      - SUPERSEDED
    QuoteState:
      description: Generado de 08_STATE_MACHINES/machines.json (Quote). No editar a mano.
      type: string
      enum:
      - DRAFT
      - ISSUED
      - ACCEPTED
      - EXPIRED
      - REJECTED
      - SUPERSEDED
    PaymentState:
      description: Generado de 08_STATE_MACHINES/machines.json (Payment). No editar a mano.
      type: string
      enum:
      - PENDING
      - PROCESSING
      - FAILED
      - CONFIRMED
      - PARTIAL_REFUND
      - REFUNDED
      - DISPUTED
    ReservationState:
      description: Generado de 08_STATE_MACHINES/machines.json (Reservation). No editar a mano.
      type: string
      enum:
      - HELD
      - ALLOCATED
      - RELEASED
      - CONSUMED
    WorkOrderState:
      description: Generado de 08_STATE_MACHINES/machines.json (WorkOrder). No editar a mano.
      type: string
      enum:
      - PLANNED
      - RELEASED
      - IN_PROGRESS
      - BLOCKED
      - QA
      - DONE
      - CANCELLED
    OrderState:
      description: Generado de 08_STATE_MACHINES/machines.json (Order). No editar a mano.
      type: string
      enum:
      - PENDING_PAYMENT
      - CONFIRMED
      - FULFILLING
      - READY
      - DELIVERED
      - CANCELLED
    JobState:
      description: Generado de 08_STATE_MACHINES/machines.json (Job). No editar a mano.
      type: string
      enum:
      - QUEUED
      - RUNNING
      - SUCCEEDED
      - FAILED
      - CANCELLED
    CertificateState:
      description: Generado de 08_STATE_MACHINES/machines.json (Certificate). No editar a mano.
      type: string
      enum:
      - DRAFT
      - ISSUED
      - REVOKED
      - SUPERSEDED
    AiProposalState:
      description: Generado de 08_STATE_MACHINES/machines.json (AiProposal). No editar a mano.
      type: string
      enum:
      - PROPOSED
      - PREVIEWING
      - ACCEPTED
      - DISCARDED
      - EXPIRED
    DesignOperation:
      description: Generado de 13_AI_PROMPTS_AND_TOOLS/tools.json (herramientas PREVIEW). No editar a mano.
      oneOf:
      - $ref: '#/components/schemas/OpCreateRing'
      - $ref: '#/components/schemas/OpCreateSetting'
      - $ref: '#/components/schemas/OpPlaceGemstone'
      - $ref: '#/components/schemas/OpModifyParameter'
      - $ref: '#/components/schemas/OpChangeMaterial'
      - $ref: '#/components/schemas/OpBooleanUnion'
      - $ref: '#/components/schemas/OpEngraveSurface'
      - $ref: '#/components/schemas/OpPatternOnCurve'
      discriminator:
        propertyName: type
        mapping:
          create_ring: '#/components/schemas/OpCreateRing'
          create_setting: '#/components/schemas/OpCreateSetting'
          place_gemstone: '#/components/schemas/OpPlaceGemstone'
          modify_parameter: '#/components/schemas/OpModifyParameter'
          change_material: '#/components/schemas/OpChangeMaterial'
          boolean_union: '#/components/schemas/OpBooleanUnion'
          engrave_surface: '#/components/schemas/OpEngraveSurface'
          pattern_on_curve: '#/components/schemas/OpPatternOnCurve'
    OpCreateRing:
      type: object
      properties:
        type:
          const: create_ring
        innerDiameter:
          type: number
          minimum: 14
          maximum: 24
        bandWidth:
          type: number
          minimum: 1.5
          maximum: 12
        radialThickness:
          type: number
          minimum: 0.8
          maximum: 4
        materialId:
          type: string
      required:
      - type
      - innerDiameter
      - bandWidth
      - radialThickness
      - materialId
      additionalProperties: false
    OpCreateSetting:
      type: object
      properties:
        type:
          const: create_setting
        familyId:
          type: string
        anchorId:
          type: string
        stoneId:
          type: string
      required:
      - type
      - familyId
      - anchorId
      - stoneId
      additionalProperties: false
    OpPlaceGemstone:
      type: object
      properties:
        type:
          const: place_gemstone
        componentId:
          type: string
        stoneId:
          type: string
        anchorId:
          type: string
      required:
      - type
      - componentId
      - stoneId
      - anchorId
      additionalProperties: false
    OpModifyParameter:
      type: object
      properties:
        type:
          const: modify_parameter
        componentId:
          type: string
        name:
          type: string
        value:
          type: number
      required:
      - type
      - componentId
      - name
      - value
      additionalProperties: false
    OpChangeMaterial:
      type: object
      properties:
        type:
          const: change_material
        componentId:
          type: string
        materialId:
          type: string
      required:
      - type
      - componentId
      - materialId
      additionalProperties: false
    OpBooleanUnion:
      type: object
      properties:
        type:
          const: boolean_union
        componentIds:
          type: array
          items:
            type: string
      required:
      - type
      - componentIds
      additionalProperties: false
    OpEngraveSurface:
      type: object
      properties:
        type:
          const: engrave_surface
        componentId:
          type: string
        text:
          type: string
          maxLength: 80
        depthMm:
          type: number
          exclusiveMinimum: 0
      required:
      - type
      - componentId
      - text
      - depthMm
      additionalProperties: false
    OpPatternOnCurve:
      type: object
      properties:
        type:
          const: pattern_on_curve
        componentId:
          type: string
        curveId:
          type: string
        count:
          type: integer
          minimum: 1
          maximum: 100
      required:
      - type
      - componentId
      - curveId
      - count
      additionalProperties: false
    Role:
      description: Generado de 21_SECURITY/roles.reference.json. No editar a mano.
      type: string
      enum:
      - guest
      - customer
      - advisor
      - designer
      - manager
      - worker
      - stockkeeper
      - inspector
      - finance
      - buyer
      - cashier
      - supplier
      - marketing
      - admin
      - owner
      - auditor
    Me:
      type: object
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 255
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            type: string
            pattern: ^[a-z]+\.[a-z]+$
      required:
      - subject
      - roles
      - permissions
      additionalProperties: false
    Money:
      type: object
      properties:
        amount: *id007
        currency:
          type: string
          pattern: ^[A-Z]{3}$
      required:
      - amount
      - currency
      additionalProperties: false
    Error:
      type: object
      description: Códigos en 06_API_CONTRACTS/errors.json; el cliente decide por `code`, nunca por `message`.
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          maxLength: 500
        correlationId: *id001
        details:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ErrorDetail'
      required:
      - code
      - message
      - correlationId
      - details
      additionalProperties: false
    ErrorCode:
      type: string
      pattern: ^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$
      maxLength: 64
    ErrorDetail:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        pointer:
          type: string
          pattern: ^(/[^/]*)*$
          maxLength: 512
          description: JSON Pointer (RFC 6901) al campo afectado del cuerpo enviado.
        message:
          type: string
          maxLength: 500
      required:
      - code
      - message
      additionalProperties: false
    Id:
      type: object
      properties:
        id: *id001
      required:
      - id
      additionalProperties: false
    Job:
      type: object
      properties:
        id: *id001
        kind:
          $ref: '#/components/schemas/JobKind'
        state:
          $ref: '#/components/schemas/JobState'
        revisionId: *id001
        simulated:
          type: boolean
          description: true si lo produjo un adaptador simulado (demo); la UI muestra el banner.
        errorCode:
          oneOf:
          - $ref: '#/components/schemas/ErrorCode'
          - type: 'null'
          description: Código estable cuando state es FAILED (06_API_CONTRACTS/errors.json); sin PII ni trazas internas.
        artifacts:
          type: array
          description: Vacío hasta SUCCEEDED. Cada archivo se descarga con getJobArtifact tras ACL.
          items:
            $ref: '#/components/schemas/JobArtifact'
        summary:
          oneOf:
          - $ref: '#/components/schemas/JobSummary'
          - type: 'null'
        projectId: *id004
      required:
      - id
      - kind
      - state
      - revisionId
      - simulated
      - errorCode
      - artifacts
      - summary
      - projectId
      additionalProperties: false
    JobKind:
      type: string
      enum:
      - PREVIEW
      - GEOMETRY
      - VALIDATION
      - AI
    JobArtifact:
      type: object
      properties:
        id: *id001
        kind:
          type: string
          enum:
          - STEP
          - STL
          - GLB_PREVIEW
          - DFM_REPORT
          - MANIFEST
          - OPERATION_DIFF
          - MESH_REPORT
        units:
          type: string
          enum:
          - mm
          - m
          - none
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        bytes:
          type: integer
          minimum: 0
        name:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$
      required:
      - id
      - kind
      - units
      - sha256
      - bytes
      - name
      additionalProperties: false
    ArtifactDownload:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: URL firmada (HMAC, 5 min) a GET /files/{sha256}; no reutilizar ni registrar.
        expiresAt:
          type: string
          format: date-time
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
      required:
      - url
      - expiresAt
      - sha256
      additionalProperties: false
    Project:
      type: object
      properties:
        id: *id004
        title:
          type: string
          minLength: 1
          maxLength: 80
        familyId:
          type: string
