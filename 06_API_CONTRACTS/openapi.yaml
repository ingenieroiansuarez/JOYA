          type: array
          items:
            type: object
            properties:
              id:
                type: string
                pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
                description: 'También es nombre de archivo de artefacto: sin rutas.'
              family:
                type: string
              familyVersion:
                type: string
              materialId:
                type: string
              parameters:
                type: object
                additionalProperties:
                  type:
                  - number
                  - string
                  - boolean
