components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    DesignState:
      description: Generado de 08_STATE_MACHINES/machines.json (Design). No editar a mano.
      type: string
      enum:
      - DRAFT
      - REVIEW
      - APPROVED
      - SUPERSEDED
    QuoteState:
      description: Generado de 08_STATE_MACHINES/machines.json (Quote). No editar a mano.
      type: string
      enum:
      - DRAFT
      - ISSUED
      - ACCEPTED
      - EXPIRED
      - REJECTED
      - SUPERSEDED
    PaymentState:
      description: Generado de 08_STATE_MACHINES/machines.json (Payment). No editar a mano.
      type: string
      enum:
      - PENDING
      - PROCESSING
      - FAILED
      - CONFIRMED
      - PARTIAL_REFUND
      - REFUNDED
      - DISPUTED
    ReservationState:
      description: Generado de 08_STATE_MACHINES/machines.json (Reservation). No editar a mano.
      type: string
      enum:
      - HELD
      - ALLOCATED
      - RELEASED
      - CONSUMED
    WorkOrderState:
      description: Generado de 08_STATE_MACHINES/machines.json (WorkOrder). No editar a mano.
      type: string
      enum:
      - PLANNED
      - RELEASED
      - IN_PROGRESS
      - BLOCKED
      - QA
      - DONE
      - CANCELLED
    OrderState:
      description: Generado de 08_STATE_MACHINES/machines.json (Order). No editar a mano.
      type: string
      enum:
      - PENDING_PAYMENT
      - CONFIRMED
      - FULFILLING
      - READY
      - DELIVERED
      - CANCELLED
    JobState:
      description: Generado de 08_STATE_MACHINES/machines.json (Job). No editar a mano.
      type: string
      enum:
      - QUEUED
      - RUNNING
      - SUCCEEDED
      - FAILED
      - CANCELLED
    CertificateState:
      description: Generado de 08_STATE_MACHINES/machines.json (Certificate). No editar a mano.
      type: string
      enum:
      - DRAFT
      - ISSUED
      - REVOKED
      - SUPERSEDED
    DesignOperation:
      description: Generado de 13_AI_PROMPTS_AND_TOOLS/tools.json (herramientas PREVIEW). No editar a mano.
      oneOf:
      - $ref: '#/components/schemas/OpCreateRing'
      - $ref: '#/components/schemas/OpCreateSetting'
      - $ref: '#/components/schemas/OpPlaceGemstone'
      - $ref: '#/components/schemas/OpModifyParameter'
      - $ref: '#/components/schemas/OpChangeMaterial'
      - $ref: '#/components/schemas/OpBooleanUnion'
      - $ref: '#/components/schemas/OpEngraveSurface'
      - $ref: '#/components/schemas/OpPatternOnCurve'
      discriminator:
        propertyName: type
        mapping:
          create_ring: '#/components/schemas/OpCreateRing'
          create_setting: '#/components/schemas/OpCreateSetting'
          place_gemstone: '#/components/schemas/OpPlaceGemstone'
          modify_parameter: '#/components/schemas/OpModifyParameter'
          change_material: '#/components/schemas/OpChangeMaterial'
          boolean_union: '#/components/schemas/OpBooleanUnion'
          engrave_surface: '#/components/schemas/OpEngraveSurface'
          pattern_on_curve: '#/components/schemas/OpPatternOnCurve'
    OpCreateRing:
      type: object
      properties:
        type:
          const: create_ring
        innerDiameter:
          type: number
          minimum: 14
          maximum: 24
        bandWidth:
          type: number
          minimum: 1.5
          maximum: 12
        radialThickness:
          type: number
          minimum: 0.8
          maximum: 4
        materialId:
          type: string
      required:
      - type
      - innerDiameter
      - bandWidth
      - radialThickness
      - materialId
      additionalProperties: false
    OpCreateSetting:
      type: object
      properties:
        type:
          const: create_setting
        familyId:
          type: string
        anchorId:
          type: string
        stoneId:
          type: string
      required:
      - type
      - familyId
      - anchorId
      - stoneId
      additionalProperties: false
    OpPlaceGemstone:
      type: object
      properties:
        type:
          const: place_gemstone
        componentId:
          type: string
        stoneId:
          type: string
        anchorId:
          type: string
      required:
      - type
      - componentId
      - stoneId
      - anchorId
      additionalProperties: false
    OpModifyParameter:
      type: object
      properties:
        type:
          const: modify_parameter
        componentId:
          type: string
        name:
          type: string
        value:
          type: number
      required:
      - type
      - componentId
      - name
      - value
      additionalProperties: false
    OpChangeMaterial:
      type: object
      properties:
        type:
          const: change_material
        componentId:
          type: string
        materialId:
          type: string
      required:
      - type
      - componentId
      - materialId
      additionalProperties: false
    OpBooleanUnion:
      type: object
      properties:
        type:
          const: boolean_union
        componentIds:
          type: array
          items:
            type: string
      required:
      - type
      - componentIds
      additionalProperties: false
    OpEngraveSurface:
      type: object
      properties:
        type:
          const: engrave_surface
        componentId:
          type: string
        text:
          type: string
          maxLength: 80
        depthMm:
          type: number
          exclusiveMinimum: 0
      required:
      - type
      - componentId
      - text
      - depthMm
      additionalProperties: false
    OpPatternOnCurve:
      type: object
      properties:
        type:
          const: pattern_on_curve
        componentId:
          type: string
        curveId:
          type: string
        count:
          type: integer
          minimum: 1
          maximum: 100
      required:
      - type
      - componentId
      - curveId
      - count
      additionalProperties: false
    Money:
      type: object
      properties:
        amount: *id004
        currency:
          type: string
          pattern: ^[A-Z]{3}$
      required:
      - amount
      - currency
      additionalProperties: false
    Error:
      type: object
      description: Códigos en 06_API_CONTRACTS/errors.json; el cliente decide por `code`, nunca por `message`.
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          maxLength: 500
        correlationId: *id002
        details:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ErrorDetail'
      required:
      - code
      - message
      - correlationId
      - details
      additionalProperties: false
    ErrorCode:
      type: string
      pattern: ^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$
      maxLength: 64
    ErrorDetail:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        pointer:
          type: string
          pattern: ^(/[^/]*)*$
          maxLength: 512
          description: JSON Pointer (RFC 6901) al campo afectado del cuerpo enviado.
        message:
          type: string
          maxLength: 500
      required:
      - code
      - message
      additionalProperties: false
    Id:
      type: object
      properties:
        id: *id002
      required:
      - id
      additionalProperties: false
    Job:
      type: object
      properties:
        id: *id002
        kind:
          $ref: '#/components/schemas/JobKind'
        state:
          $ref: '#/components/schemas/JobState'
        revisionId: *id002
        simulated:
          type: boolean
          description: true si lo produjo un adaptador simulado (demo); la UI muestra el banner.
        errorCode:
          oneOf:
          - $ref: '#/components/schemas/ErrorCode'
          - type: 'null'
          description: Código estable cuando state es FAILED (06_API_CONTRACTS/errors.json); sin PII ni trazas internas.
        artifacts:
          type: array
          description: Vacío hasta SUCCEEDED. Cada archivo se descarga con getJobArtifact tras ACL.
          items:
            $ref: '#/components/schemas/JobArtifact'
      required:
      - id
      - kind
      - state
      - revisionId
      - simulated
      - errorCode
      - artifacts
      additionalProperties: false
    JobKind:
      type: string
      enum:
      - PREVIEW
      - GEOMETRY
      - VALIDATION
      - AI
    JobArtifact:
      type: object
      properties:
        id: *id002
        kind:
          type: string
          enum:
          - STEP
          - STL
          - GLB_PREVIEW
          - DFM_REPORT
          - MANIFEST
          - OPERATION_DIFF
          - MESH_REPORT
        units:
          type: string
          enum:
          - mm
          - m
          - none
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        bytes:
          type: integer
          minimum: 0
      required:
      - id
      - kind
      - units
      - sha256
      - bytes
      additionalProperties: false
    ArtifactDownload:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: URL firmada de corta duración; no reutilizar ni registrar.
        expiresAt:
          type: string
          format: date-time
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
      required:
      - url
      - expiresAt
      - sha256
      additionalProperties: false
    Project:
      type: object
      properties:
        id: *id002
        title: *id001
        headRevisionId: *id002
      required:
      - id
      - title
      - headRevisionId
      additionalProperties: false
    Revision:
      type: object
      properties:
        id: *id002
        projectId: *id002
        number: *id003
        digest: *id001
        document: &id005
          type: object
        state:
          $ref: '#/components/schemas/DesignState'
      required:
      - id
      - projectId
      - number
      - digest
      - document
      - state
      additionalProperties: false
    Quote:
      type: object
      properties:
        id: *id002
        revisionId: *id002
        state:
          $ref: '#/components/schemas/QuoteState'
        total:
          $ref: '#/components/schemas/Money'
        expiresAt:
          type: string
          format: date-time
        digest: *id001
      required:
      - id
      - revisionId
      - state
      - total
      - expiresAt
      - digest
      additionalProperties: false
    Estimate:
      type: object
      properties:
        total:
          $ref: '#/components/schemas/Money'
        lines:
          type: array
          items:
            type: object
            properties:
              label: *id001
              amount:
                $ref: '#/components/schemas/Money'
            required:
            - label
            - amount
            additionalProperties: false
        snapshotId: *id002
        estimated:
          type: boolean
      required:
      - total
      - lines
      - snapshotId
      - estimated
      additionalProperties: false
    Payment:
      type: object
      properties:
        id: *id002
        orderId: *id002
        amount:
          $ref: '#/components/schemas/Money'
        state:
          $ref: '#/components/schemas/PaymentState'
      required:
      - id
      - orderId
      - amount
      - state
      additionalProperties: false
    Order:
      type: object
      properties:
        id: *id002
        quoteId: *id002
        state:
          $ref: '#/components/schemas/OrderState'
      required:
      - id
      - quoteId
      - state
      additionalProperties: false
    Reservation:
      type: object
      properties:
        id: *id002
        lotId: *id002
        quantity: *id004
        state:
          $ref: '#/components/schemas/ReservationState'
      required:
      - id
      - lotId
      - quantity
      - state
      additionalProperties: false
    WorkOrder:
      type: object
      properties:
        id: *id002
        revisionId: *id002
        orderId: *id002
        state:
          $ref: '#/components/schemas/WorkOrderState'
      required:
      - id
      - revisionId
      - orderId
      - state
      additionalProperties: false
    Certificate:
      type: object
      properties:
        id: *id002
        state:
          $ref: '#/components/schemas/CertificateState'
        issuer: *id001
        publicSummary: *id005
      required:
      - id
      - state
      - issuer
      - publicSummary
      additionalProperties: false
    BranchName:
      type: string
      description: Una rama se identifica por proyecto y nombre (SQL branch(project_id, name)).
      pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
    SyncOperation:
      type: object
      description: Operación de diseño hecha sin conexión (22_OFFLINE_AND_SYNC/SYNC.md). La operación es un DesignOperation, la misma lista permitida que en línea.
      properties:
        id: *id002
        projectId: *id002
        branch:
          $ref: '#/components/schemas/BranchName'
        baseRevisionId: *id002
        sequence:
          type: integer
          minimum: 1
          description: Orden lógico por proyecto y rama en el dispositivo.
        createdAt:
          type: string
          format: date-time
        operation:
          $ref: '#/components/schemas/DesignOperation'
      required:
      - id
      - projectId
      - branch
      - baseRevisionId
      - sequence
      - createdAt
      - operation
      additionalProperties: false
    SyncResult:
      type: object
      description: Un resultado por operación enviada, en el mismo orden. Repetir una operación ya procesada devuelve su resultado original.
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SyncOperationResult'
        cursor: *id001
      required:
      - results
      - cursor
      additionalProperties: false
    SyncOperationResult:
      oneOf:
      - $ref: '#/components/schemas/SyncApplied'
      - $ref: '#/components/schemas/SyncConflict'
      - $ref: '#/components/schemas/SyncRejected'
      discriminator:
        propertyName: status
        mapping:
          APPLIED: '#/components/schemas/SyncApplied'
          CONFLICT: '#/components/schemas/SyncConflict'
          REJECTED: '#/components/schemas/SyncRejected'
    SyncApplied:
      type: object
      properties:
        operationId: *id002
        status:
          const: APPLIED
        revisionId: *id002
      required:
      - operationId
      - status
      - revisionId
      additionalProperties: false
    SyncConflict:
      type: object
      description: La revisión base ya no es la actual. No hay last-write-wins; el cliente conserva la operación y ofrece resolver.
      properties:
        operationId: *id002
        status:
          const: CONFLICT
        serverRevisionId: *id002
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - operationId
      - status
      - serverRevisionId
      - error
      additionalProperties: false
    SyncRejected:
      type: object
      description: La operación no se aplicará nunca (permiso, esquema o regla); el cliente no la reintenta.
      properties:
        operationId: *id002
        status:
          const: REJECTED
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - operationId
      - status
      - error
      additionalProperties: false
    Page:
      type: object
      properties:
        items:
          type: array
          items: *id005
        nextCursor:
          type:
          - string
          - 'null'
      required:
      - items
      - nextCursor
      additionalProperties: false
    Result:
      type: object
      properties:
        id: *id002
        state: *id001
      required:
      - id
      - state
      additionalProperties: false
    Product:
      type: object
      properties:
        id: *id002
        name: *id001
        price:
          $ref: '#/components/schemas/Money'
        available:
          type: boolean
        customizable:
          type: boolean
      required:
      - id
      - name
      - price
      - available
      - customizable
      additionalProperties: false
    InventoryLot:
      type: object
      properties:
        id: *id002
        itemKey: *id001
        unit:
          type: string
          enum:
          - g
          - ct
          - ea
        onHand: *id004
        reserved: *id004
      required:
      - id
      - itemKey
      - unit
      - onHand
      - reserved
      additionalProperties: false
    Task:
      type: object
      properties:
        id: *id002
        workOrderId: *id002
        state: *id001
        assignedTo: *id002
      required:
      - id
      - workOrderId
      - state
      - assignedTo
      additionalProperties: false
    Customer:
      type: object
      properties:
        id: *id002
        displayName: *id001
        consent: *id005
      required:
      - id
      - displayName
      - consent
      additionalProperties: false
    Event:
      description: Sobre único de eventos para outbox, consumidores, WebSocket y sync pull. El Event de OpenAPI y la tabla outbox se verifican contra este archivo (tools/contracts/check_contracts.py).
      type: object
      required:
      - eventId
      - eventType
      - schemaVersion
      - aggregateId
      - aggregateVersion
      - occurredAt
      - correlationId
      - payload
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          pattern: ^[A-Z][A-Za-z0-9]{2,63}$
        schemaVersion:
          type: integer
          minimum: 1
        aggregateId:
          type: string
          format: uuid
        aggregateVersion:
          type: integer
          minimum: 1
        occurredAt:
          type: string
          format: date-time
        correlationId:
          type: string
          format: uuid
        causationId:
