            properties:
              id:
                type: string
                format: uuid
              type:
                type: string
              target:
                type: string
              parameters:
                type: object
                additionalProperties:
                  type:
                  - number
                  - string
                  - boolean
            required:
            - id
            - type
            - target
            - parameters
            additionalProperties: false
        constraints:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              target:
                type: string
              parameters:
                type: object
                additionalProperties:
                  type:
                  - number
                  - string
                  - boolean
            required:
            - type
            - target
            - parameters
            additionalProperties: false
